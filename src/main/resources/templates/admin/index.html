<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 — 校园水电费管理系统</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><span class="icon">🏫</span> 水电管理</h2>
                <p>管理后台</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">管理菜单</div>
                    <a href="/admin" class="nav-item active"><span class="nav-icon">📊</span> 首页概览</a>
                    <a href="/admin/bills" class="nav-item"><span class="nav-icon">📝</span> 水电费录入</a>
                    <a href="/admin/config" class="nav-item"><span class="nav-icon">⚙️</span> 单价配置</a>
                    <a href="/admin/messages" class="nav-item"><span class="nav-icon">📨</span> 消息管理</a>
                    <a href="/admin/users" class="nav-item"><span class="nav-icon">👥</span> 用户管理</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">管</div>
                    <div class="user-detail">
                        <div class="user-name" id="userName">管理员</div>
                        <div class="user-role" id="userRole">管理员</div>
                    </div>
                    <button class="logout-btn" onclick="doLogout()" title="退出登录">⏻</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">管理后台首页</h1>
                <div class="header-actions">
                    <span class="text-muted" id="todayDate"></span>
                </div>
            </header>

            <div class="content-body">
                <!-- 统计卡片 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue">📄</div>
                        <div class="stat-info">
                            <h4 id="statTotalBills">-</h4>
                            <p>账单总数</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">❌</div>
                        <div class="stat-info">
                            <h4 id="statUnpaidBills">-</h4>
                            <p>未缴账单</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">✅</div>
                        <div class="stat-info">
                            <h4 id="statPaidBills">-</h4>
                            <p>已缴账单</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">💧</div>
                        <div class="stat-info">
                            <h4 id="statPrices">-</h4>
                            <p>当前水/电单价</p>
                        </div>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <!-- 快捷操作 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>⚡ 快捷操作</h3>
                        </div>
                        <div class="card-body">
                            <div style="display:grid; gap:12px;">
                                <a href="/admin/bills" class="btn btn-primary btn-block" style="padding:16px; font-size:16px;">
                                    📝 水电费录入 — 输入用量，自动生成账单
                                </a>
                                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
                                    <button class="btn btn-warning btn-block" onclick="doRemind()">
                                        📢 一键催缴
                                    </button>
                                    <a href="/admin/config" class="btn btn-outline btn-block">
                                        ⚙️ 修改单价
                                    </a>
                                    <a href="/admin/messages" class="btn btn-outline btn-block">
                                        📨 发消息
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 最近未缴账单 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>❌ 待缴账单</h3>
                            <a href="/admin/bills" class="btn btn-outline btn-sm">查看全部</a>
                        </div>
                        <div class="card-body">
                            <div class="table-wrapper">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>宿舍</th>
                                            <th>月份</th>
                                            <th>金额</th>
                                        </tr>
                                    </thead>
                                    <tbody id="unpaidBillsTable">
                                        <tr><td colspan="3" class="text-center text-muted">加载中...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!pageInit({ requireAdmin: true })) throw new Error('Not admin');

        // 显示当前日期
        const now = new Date();
        document.getElementById('todayDate').textContent =
            `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

        async function loadDashboard() {
            try {
                const [allBills, config] = await Promise.all([
                    api.get('/api/bills'),
                    api.get('/api/config/prices')
                ]);

                const paid = allBills.filter(b => b.payStatus === 1);
                const unpaid = allBills.filter(b => b.payStatus === 0);

                document.getElementById('statTotalBills').textContent = allBills.length;
                document.getElementById('statUnpaidBills').textContent = unpaid.length;
                document.getElementById('statPaidBills').textContent = paid.length;
                document.getElementById('statPrices').textContent =
                    `水¥${formatMoney(config.waterPrice)} / 电¥${formatMoney(config.electricPrice)}`;

                // 最近未缴账单
                const recent = unpaid.sort((a, b) => b.billId - a.billId).slice(0, 8);
                if (recent.length > 0) {
                    document.getElementById('unpaidBillsTable').innerHTML = recent.map(b => `
                        <tr>
                            <td>${b.dorm}</td>
                            <td>${b.yearMonth}</td>
                            <td class="font-bold">¥${formatMoney(b.totalMoney)}</td>
                        </tr>
                    `).join('');
                } else {
                    document.getElementById('unpaidBillsTable').innerHTML =
                        '<tr><td colspan="3" class="text-center text-muted">暂无未缴账单 🎉</td></tr>';
                }
            } catch (e) {
                toast.error(e.message);
            }
        }

        async function doRemind() {
            if (!confirmAction('确定要向所有未缴费宿舍发送催缴消息吗？')) return;
            try {
                const result = await api.post('/api/bills/remind', { operatorNo: auth.getStudentNo() });
                toast.success(`催缴完成，共发送 ${result.sentCount} 条消息`);
            } catch (e) {
                toast.error(e.message);
            }
        }

        loadDashboard();

        function doLogout() {
            auth.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
