<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 — 校园水电费管理系统</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><span class="icon">🏫</span> 水电管理</h2>
                <p>管理后台</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">管理菜单</div>
                    <a href="/admin" class="nav-item"><span class="nav-icon">📊</span> 首页概览</a>
                    <a href="/admin/bills" class="nav-item"><span class="nav-icon">📄</span> 账单管理</a>
                    <a href="/admin/config" class="nav-item"><span class="nav-icon">⚙️</span> 单价配置</a>
                    <a href="/admin/messages" class="nav-item"><span class="nav-icon">📨</span> 消息管理</a>
                    <a href="/admin/users" class="nav-item active"><span class="nav-icon">👥</span> 用户管理</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">管</div>
                    <div class="user-detail">
                        <div class="user-name" id="userName">管理员</div>
                        <div class="user-role" id="userRole">管理员</div>
                    </div>
                    <button class="logout-btn" onclick="doLogout()" title="退出登录">⏻</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">用户管理</h1>
                <div class="header-actions">
                    <span class="text-muted">查看学生信息和余额</span>
                </div>
            </header>

            <div class="content-body">
                <!-- 查询 -->
                <div class="card">
                    <div class="card-body">
                        <div class="form-inline">
                            <input type="text" id="searchStudentNo" class="form-control" placeholder="输入学号查询" style="width:200px;">
                            <button class="btn btn-primary" onclick="searchUser()">🔍 查询</button>
                            <button class="btn btn-outline" onclick="clearSearch()">↻ 重置</button>
                        </div>
                    </div>
                </div>

                <!-- 用户信息卡片 -->
                <div class="card" id="userCard" style="display:none;">
                    <div class="card-header">
                        <h3>👤 用户信息</h3>
                    </div>
                    <div class="card-body">
                        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px;">
                            <div>
                                <span class="text-muted">学号</span>
                                <div id="uStudentNo" class="font-bold" style="font-size:16px; margin-top:4px;">-</div>
                            </div>
                            <div>
                                <span class="text-muted">姓名</span>
                                <div id="uName" class="font-bold" style="font-size:16px; margin-top:4px;">-</div>
                            </div>
                            <div>
                                <span class="text-muted">宿舍</span>
                                <div id="uDorm" class="font-bold" style="font-size:16px; margin-top:4px;">-</div>
                            </div>
                            <div>
                                <span class="text-muted">账户余额</span>
                                <div id="uBalance" class="font-bold text-success" style="font-size:20px; margin-top:4px;">-</div>
                            </div>
                            <div>
                                <span class="text-muted">角色</span>
                                <div id="uRole" class="font-bold" style="font-size:16px; margin-top:4px;">-</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 该用户的账单 -->
                <div class="card" id="userBillsCard" style="display:none;">
                    <div class="card-header">
                        <h3>📄 用户账单</h3>
                    </div>
                    <div class="card-body">
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>账单ID</th>
                                        <th>宿舍</th>
                                        <th>月份</th>
                                        <th>金额</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody id="userBillsTable">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 该用户的消息 -->
                <div class="card" id="userMsgsCard" style="display:none;">
                    <div class="card-header">
                        <h3>🔔 用户消息</h3>
                    </div>
                    <div class="card-body" id="userMsgsList">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!pageInit({ requireAdmin: true })) throw new Error('Not admin');
        setActiveNav('/admin/users');

        async function searchUser() {
            const studentNo = document.getElementById('searchStudentNo').value.trim();
            if (!studentNo) { toast.warning('请输入学号'); return; }

            try {
                const user = await api.get(`/api/users/${studentNo}`);

                // 显示用户信息
                document.getElementById('uStudentNo').textContent = user.studentNo;
                document.getElementById('uName').textContent = user.username;
                document.getElementById('uDorm').textContent = user.dorm;
                document.getElementById('uBalance').textContent = '¥' + formatMoney(user.studentMoney);
                document.getElementById('uRole').textContent = user.role === 'admin' ? '管理员' : '学生';
                document.getElementById('userCard').style.display = 'block';

                // 加载该用户的账单
                const bills = await api.get(`/api/bills?dorm=${encodeURIComponent(user.dorm)}`);
                document.getElementById('userBillsCard').style.display = 'block';
                if (bills.length > 0) {
                    document.getElementById('userBillsTable').innerHTML = bills.map(b => `
                        <tr>
                            <td>${b.billId}</td>
                            <td>${b.dorm}</td>
                            <td>${b.yearMonth}</td>
                            <td class="font-bold">¥${formatMoney(b.totalMoney)}</td>
                            <td>${payStatusTag(b.payStatus)}</td>
                        </tr>
                    `).join('');
                } else {
                    document.getElementById('userBillsTable').innerHTML =
                        '<tr><td colspan="5" class="text-center text-muted">暂无账单</td></tr>';
                }

                // 加载该用户的消息
                const msgs = await api.get(`/api/messages?studentNo=${studentNo}`);
                document.getElementById('userMsgsCard').style.display = 'block';
                if (msgs.length > 0) {
                    document.getElementById('userMsgsList').innerHTML = msgs.slice(0, 10).map(m => `
                        <div class="msg-item ${m.isRead === 0 ? 'unread' : ''}">
                            <div class="msg-dot ${m.isRead === 1 ? 'read' : ''}"></div>
                            <div class="msg-content">
                                <div class="msg-title">${m.title}</div>
                                <div class="msg-text">${m.content}</div>
                                <div class="msg-meta">
                                    <span>${msgTypeTag(m.msgType)}</span>
                                    <span>${formatDateTime(m.createTime)}</span>
                                    <span>${m.isRead === 0 ? '未读' : '已读'}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('userMsgsList').innerHTML =
                        '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无消息</p></div>';
                }

            } catch (e) {
                toast.error(e.message);
                document.getElementById('userCard').style.display = 'none';
                document.getElementById('userBillsCard').style.display = 'none';
                document.getElementById('userMsgsCard').style.display = 'none';
            }
        }

        function clearSearch() {
            document.getElementById('searchStudentNo').value = '';
            document.getElementById('userCard').style.display = 'none';
            document.getElementById('userBillsCard').style.display = 'none';
            document.getElementById('userMsgsCard').style.display = 'none';
        }

        // 回车搜索
        document.getElementById('searchStudentNo').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') searchUser();
        });

        function doLogout() {
            auth.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
