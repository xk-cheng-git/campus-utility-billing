<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单价配置 — 校园水电费管理系统</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><span class="icon">🏫</span> 水电管理</h2>
                <p>管理后台</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">管理菜单</div>
                    <a href="/admin" class="nav-item"><span class="nav-icon">📊</span> 首页概览</a>
                    <a href="/admin/bills" class="nav-item"><span class="nav-icon">📄</span> 账单管理</a>
                    <a href="/admin/config" class="nav-item active"><span class="nav-icon">⚙️</span> 单价配置</a>
                    <a href="/admin/messages" class="nav-item"><span class="nav-icon">📨</span> 消息管理</a>
                    <a href="/admin/users" class="nav-item"><span class="nav-icon">👥</span> 用户管理</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">管</div>
                    <div class="user-detail">
                        <div class="user-name" id="userName">管理员</div>
                        <div class="user-role" id="userRole">管理员</div>
                    </div>
                    <button class="logout-btn" onclick="doLogout()" title="退出登录">⏻</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">水电单价配置</h1>
            </header>

            <div class="content-body">
                <div style="max-width:600px;">
                    <!-- 当前价格 -->
                    <div class="card">
                        <div class="card-header">
                            <h3>💰 当前单价</h3>
                        </div>
                        <div class="card-body">
                            <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
                                <div class="stat-card">
                                    <div class="stat-icon blue">💧</div>
                                    <div class="stat-info">
                                        <h4 id="currentWater">-</h4>
                                        <p>水单价（元/吨）</p>
                                    </div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-icon orange">⚡</div>
                                    <div class="stat-info">
                                        <h4 id="currentElectric">-</h4>
                                        <p>电单价（元/度）</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 修改价格 -->
                    <div class="card mt-4">
                        <div class="card-header">
                            <h3>✏️ 修改单价</h3>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label>水单价（元/吨）</label>
                                <input type="number" id="newWaterPrice" class="form-control" placeholder="如：2.88" min="0" step="0.01">
                            </div>
                            <div class="form-group">
                                <label>电单价（元/度）</label>
                                <input type="number" id="newElectricPrice" class="form-control" placeholder="如：0.65" min="0" step="0.01">
                            </div>
                            <div style="background:var(--warning-light); border-radius:8px; padding:12px; margin-bottom:16px;">
                                <span class="text-warning">⚠ 注意：修改单价后，新创建的账单将使用新价格计算。</span>
                            </div>
                            <button class="btn btn-primary" onclick="updatePrices()">保存修改</button>
                        </div>
                    </div>

                    <!-- 计算器 -->
                    <div class="card mt-4">
                        <div class="card-header">
                            <h3>🧮 费用计算器</h3>
                        </div>
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>用水量（吨）</label>
                                    <input type="number" id="calcWater" class="form-control" placeholder="0" min="0" step="0.01" oninput="calcTotal()">
                                </div>
                                <div class="form-group">
                                    <label>用电量（度）</label>
                                    <input type="number" id="calcElectric" class="form-control" placeholder="0" min="0" step="0.01" oninput="calcTotal()">
                                </div>
                            </div>
                            <div style="background:var(--gray-50); border-radius:8px; padding:16px; text-align:center;">
                                <span class="text-muted">预估总费用</span>
                                <div id="calcResult" style="font-size:28px; font-weight:700; color:var(--primary); margin-top:4px;">¥0.00</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!pageInit({ requireAdmin: true })) throw new Error('Not admin');
        setActiveNav('/admin/config');

        let waterPrice = 0, electricPrice = 0;

        async function loadConfig() {
            try {
                const config = await api.get('/api/config/prices');
                waterPrice = parseFloat(config.waterPrice);
                electricPrice = parseFloat(config.electricPrice);

                document.getElementById('currentWater').textContent = '¥' + formatMoney(waterPrice);
                document.getElementById('currentElectric').textContent = '¥' + formatMoney(electricPrice);
                document.getElementById('newWaterPrice').value = waterPrice;
                document.getElementById('newElectricPrice').value = electricPrice;
            } catch (e) {
                toast.error(e.message);
            }
        }

        async function updatePrices() {
            const newWater = parseFloat(document.getElementById('newWaterPrice').value);
            const newElectric = parseFloat(document.getElementById('newElectricPrice').value);

            if (isNaN(newWater) || newWater <= 0) { toast.warning('请输入有效的水单价'); return; }
            if (isNaN(newElectric) || newElectric <= 0) { toast.warning('请输入有效的电单价'); return; }

            if (newWater === waterPrice && newElectric === electricPrice) {
                toast.warning('单价未变化');
                return;
            }

            try {
                await api.put('/api/config/prices', {
                    operatorNo: auth.getStudentNo(),
                    waterPrice: newWater,
                    electricPrice: newElectric
                });
                toast.success('单价更新成功');
                loadConfig();
            } catch (e) {
                toast.error(e.message);
            }
        }

        function calcTotal() {
            const w = parseFloat(document.getElementById('calcWater').value) || 0;
            const el = parseFloat(document.getElementById('calcElectric').value) || 0;
            const total = w * waterPrice + el * electricPrice;
            document.getElementById('calcResult').textContent = '¥' + formatMoney(total);
        }

        loadConfig();

        function doLogout() {
            auth.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
