<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缴费记录 — 校园水电费管理系统</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><span class="icon">🏫</span> 水电管理</h2>
                <p>学生服务中心</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">主菜单</div>
                    <a href="/student" class="nav-item"><span class="nav-icon">📊</span> 首页概览</a>
                    <a href="/student/bills" class="nav-item"><span class="nav-icon">📄</span> 我的账单</a>
                    <a href="/student/payments" class="nav-item active"><span class="nav-icon">💳</span> 缴费记录</a>
                    <a href="/student/messages" class="nav-item"><span class="nav-icon">🔔</span> 消息中心<span class="badge" id="msgBadge" style="display:none">0</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">个人</div>
                    <a href="/student/profile" class="nav-item"><span class="nav-icon">👤</span> 个人中心</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">-</div>
                    <div class="user-detail">
                        <div class="user-name" id="userName">-</div>
                        <div class="user-role" id="userRole">学生</div>
                    </div>
                    <button class="logout-btn" onclick="doLogout()" title="退出登录">⏻</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">缴费记录</h1>
                <div class="header-actions">
                    <div class="balance-display">💰 余额：<span id="balanceDisplay">¥0.00</span></div>
                </div>
            </header>

            <div class="content-body">
                <!-- 汇总统计 -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue">💰</div>
                        <div class="stat-info">
                            <h4 id="statTotal">¥0.00</h4>
                            <p>累计缴费</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">📄</div>
                        <div class="stat-info">
                            <h4 id="statBillPay">¥0.00</h4>
                            <p>账单缴费</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">💳</div>
                        <div class="stat-info">
                            <h4 id="statTopUp">¥0.00</h4>
                            <p>累计充值</p>
                        </div>
                    </div>
                </div>

                <!-- 记录列表 -->
                <div class="card">
                    <div class="card-header">
                        <h3>💳 缴费/充值明细</h3>
                        <span class="text-muted" id="recordCount">共 0 条</span>
                    </div>
                    <div class="card-body">
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>记录ID</th>
                                        <th>类型</th>
                                        <th>金额</th>
                                        <th>关联账单</th>
                                        <th>时间</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentTable">
                                    <tr><td colspan="5" class="text-center text-muted">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!pageInit()) throw new Error('Not logged in');
        setActiveNav('/student/payments');

        async function loadPayments() {
            try {
                const records = await api.get(`/api/payments?studentNo=${auth.getStudentNo()}`);
                document.getElementById('recordCount').textContent = `共 ${records.length} 条`;

                // 汇总
                let totalAll = 0, totalBill = 0, totalTopUp = 0;
                records.forEach(r => {
                    const m = parseFloat(r.payMoney) || 0;
                    totalAll += m;
                    if (r.payType === 1) totalBill += m;
                    if (r.payType === 2) totalTopUp += m;
                });
                document.getElementById('statTotal').textContent = '¥' + formatMoney(totalAll);
                document.getElementById('statBillPay').textContent = '¥' + formatMoney(totalBill);
                document.getElementById('statTopUp').textContent = '¥' + formatMoney(totalTopUp);

                if (records.length === 0) {
                    document.getElementById('paymentTable').innerHTML =
                        '<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">💳</div><p>暂无缴费记录</p></div></td></tr>';
                    return;
                }

                document.getElementById('paymentTable').innerHTML = records.map(r => `
                    <tr>
                        <td>${r.payId}</td>
                        <td>${payTypeTag(r.payType)}</td>
                        <td class="font-bold">¥${formatMoney(r.payMoney)}</td>
                        <td>${r.billId || '-'}</td>
                        <td>${formatDateTime(r.payTime)}</td>
                    </tr>
                `).join('');
            } catch (e) {
                toast.error(e.message);
            }
        }

        loadPayments();

        function doLogout() {
            auth.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
