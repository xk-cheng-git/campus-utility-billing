<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的账单 — 校园水电费管理系统</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><span class="icon">🏫</span> 水电管理</h2>
                <p>学生服务中心</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">主菜单</div>
                    <a href="/student" class="nav-item"><span class="nav-icon">📊</span> 首页概览</a>
                    <a href="/student/bills" class="nav-item active"><span class="nav-icon">📄</span> 我的账单</a>
                    <a href="/student/payments" class="nav-item"><span class="nav-icon">💳</span> 缴费记录</a>
                    <a href="/student/messages" class="nav-item"><span class="nav-icon">🔔</span> 消息中心<span class="badge" id="msgBadge" style="display:none">0</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">个人</div>
                    <a href="/student/profile" class="nav-item"><span class="nav-icon">👤</span> 个人中心</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">-</div>
                    <div class="user-detail">
                        <div class="user-name" id="userName">-</div>
                        <div class="user-role" id="userRole">学生</div>
                    </div>
                    <button class="logout-btn" onclick="doLogout()" title="退出登录">⏻</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">我的账单</h1>
                <div class="header-actions">
                    <div class="balance-display">💰 余额：<span id="balanceDisplay">¥0.00</span></div>
                </div>
            </header>

            <div class="content-body">
                <!-- 筛选条件 -->
                <div class="card">
                    <div class="card-body">
                        <div class="form-inline">
                            <select id="filterStatus" class="form-control" style="width:150px;">
                                <option value="">全部状态</option>
                                <option value="0">未缴费</option>
                                <option value="1">已缴费</option>
                            </select>
                            <input type="month" id="filterMonth" class="form-control" style="width:180px;">
                            <button class="btn btn-primary" onclick="loadBills()">🔍 查询</button>
                            <button class="btn btn-outline" onclick="resetFilter()">↻ 重置</button>
                        </div>
                    </div>
                </div>

                <!-- 账单列表 -->
                <div class="card">
                    <div class="card-header">
                        <h3>📄 账单列表</h3>
                        <span class="text-muted" id="billCount">共 0 条</span>
                    </div>
                    <div class="card-body">
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>账单ID</th>
                                        <th>宿舍</th>
                                        <th>账单月份</th>
                                        <th>用水量(吨)</th>
                                        <th>用电量(度)</th>
                                        <th>应缴金额</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="billTable">
                                    <tr><td colspan="8" class="text-center text-muted">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 缴费确认弹窗 -->
    <div class="modal-overlay" id="payModal">
        <div class="modal">
            <div class="modal-header">
                <h3>确认缴费</h3>
                <button class="modal-close" onclick="closeModal('payModal')">✕</button>
            </div>
            <div class="modal-body">
                <p>确定要支付以下账单吗？</p>
                <div style="background:var(--gray-50); border-radius:8px; padding:16px; margin-top:12px;">
                    <div class="d-flex justify-between mb-2">
                        <span class="text-muted">账单月份</span>
                        <span id="payMonth" class="font-bold">-</span>
                    </div>
                    <div class="d-flex justify-between mb-2">
                        <span class="text-muted">宿舍</span>
                        <span id="payDorm" class="font-bold">-</span>
                    </div>
                    <div class="d-flex justify-between mb-2">
                        <span class="text-muted">应缴金额</span>
                        <span id="payAmount" class="font-bold text-danger" style="font-size:18px;">-</span>
                    </div>
                    <div class="d-flex justify-between">
                        <span class="text-muted">当前余额</span>
                        <span id="payBalance" class="font-bold">-</span>
                    </div>
                </div>
                <p id="payWarning" class="text-danger mt-2" style="display:none; font-size:13px;">⚠ 余额不足，请先充值</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('payModal')">取消</button>
                <button class="btn btn-primary" id="confirmPayBtn" onclick="confirmPay()">确认支付</button>
            </div>
        </div>
    </div>

    <!-- 账单详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h3>账单详情</h3>
                <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
            </div>
            <div class="modal-body" id="detailContent"></div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('detailModal')">关闭</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!pageInit()) throw new Error('Not logged in');
        setActiveNav('/student/bills');

        let currentPayBill = null;

        async function loadBills() {
            const studentNo = auth.getStudentNo();
            const dorm = auth.get().dorm;
            const status = document.getElementById('filterStatus').value;
            const month = document.getElementById('filterMonth').value;

            let url = `/api/bills?dorm=${encodeURIComponent(dorm)}`;
            if (status !== '') url += `&payStatus=${status}`;
            if (month) url += `&yearMonth=${month}`;

            try {
                const bills = await api.get(url);
                document.getElementById('billCount').textContent = `共 ${bills.length} 条`;

                if (bills.length === 0) {
                    document.getElementById('billTable').innerHTML =
                        '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📄</div><p>暂无账单记录</p></div></td></tr>';
                    return;
                }

                document.getElementById('billTable').innerHTML = bills.map(b => `
                    <tr>
                        <td>${b.billId}</td>
                        <td>${b.dorm}</td>
                        <td>${b.yearMonth}</td>
                        <td>${parseFloat(b.waterUsage).toFixed(2)}</td>
                        <td>${parseFloat(b.electricUsage).toFixed(2)}</td>
                        <td class="font-bold">¥${formatMoney(b.totalMoney)}</td>
                        <td>${payStatusTag(b.payStatus)}</td>
                        <td>
                            ${b.payStatus === 0
                                ? `<button class="btn btn-primary btn-sm" onclick="openPayModal(${b.billId}, '${b.yearMonth}', '${b.dorm}', ${b.totalMoney})">缴费</button>`
                                : `<button class="btn btn-outline btn-sm" onclick="showDetail(${b.billId})">详情</button>`
                            }
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                toast.error(e.message);
            }
        }

        function resetFilter() {
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterMonth').value = '';
            loadBills();
        }

        function openPayModal(billId, yearMonth, dorm, totalMoney) {
            currentPayBill = { billId, yearMonth, dorm, totalMoney };
            const user = auth.get();

            document.getElementById('payMonth').textContent = yearMonth;
            document.getElementById('payDorm').textContent = dorm;
            document.getElementById('payAmount').textContent = '¥' + formatMoney(totalMoney);
            document.getElementById('payBalance').textContent = '¥' + formatMoney(user.studentMoney);

            const insufficient = parseFloat(user.studentMoney) < parseFloat(totalMoney);
            document.getElementById('payWarning').style.display = insufficient ? 'block' : 'none';
            document.getElementById('confirmPayBtn').disabled = insufficient;

            openModal('payModal');
        }

        async function confirmPay() {
            if (!currentPayBill) return;
            const btn = document.getElementById('confirmPayBtn');
            btn.disabled = true;
            btn.textContent = '支付中...';

            try {
                await api.put(`/api/bills/${currentPayBill.billId}/pay`, { studentNo: auth.getStudentNo() });
                toast.success('缴费成功！');
                closeModal('payModal');
                // 刷新余额
                await loadBalance();
                loadBills();
            } catch (e) {
                toast.error(e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '确认支付';
            }
        }

        async function showDetail(billId) {
            try {
                const b = await api.get(`/api/bills/${billId}`);
                document.getElementById('detailContent').innerHTML = `
                    <div style="display:grid; gap:12px;">
                        <div class="d-flex justify-between"><span class="text-muted">账单ID</span><span>${b.billId}</span></div>
                        <div class="d-flex justify-between"><span class="text-muted">宿舍</span><span>${b.dorm}</span></div>
                        <div class="d-flex justify-between"><span class="text-muted">账单月份</span><span>${b.yearMonth}</span></div>
                        <div class="d-flex justify-between"><span class="text-muted">用水量</span><span>${parseFloat(b.waterUsage).toFixed(2)} 吨</span></div>
                        <div class="d-flex justify-between"><span class="text-muted">用电量</span><span>${parseFloat(b.electricUsage).toFixed(2)} 度</span></div>
                        <div class="d-flex justify-between"><span class="text-muted">应缴金额</span><span class="font-bold">¥${formatMoney(b.totalMoney)}</span></div>
                        <div class="d-flex justify-between"><span class="text-muted">缴费状态</span>${payStatusTag(b.payStatus)}</div>
                        <div class="d-flex justify-between"><span class="text-muted">创建人</span><span>${b.createBy || '-'}</span></div>
                    </div>
                `;
                openModal('detailModal');
            } catch (e) {
                toast.error(e.message);
            }
        }

        loadBills();

        function doLogout() {
            auth.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
