<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息中心 — 校园水电费管理系统</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><span class="icon">🏫</span> 水电管理</h2>
                <p>学生服务中心</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">主菜单</div>
                    <a href="/student" class="nav-item"><span class="nav-icon">📊</span> 首页概览</a>
                    <a href="/student/bills" class="nav-item"><span class="nav-icon">📄</span> 我的账单</a>
                    <a href="/student/payments" class="nav-item"><span class="nav-icon">💳</span> 缴费记录</a>
                    <a href="/student/messages" class="nav-item active"><span class="nav-icon">🔔</span> 消息中心<span class="badge" id="msgBadge" style="display:none">0</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">个人</div>
                    <a href="/student/profile" class="nav-item"><span class="nav-icon">👤</span> 个人中心</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">-</div>
                    <div class="user-detail">
                        <div class="user-name" id="userName">-</div>
                        <div class="user-role" id="userRole">学生</div>
                    </div>
                    <button class="logout-btn" onclick="doLogout()" title="退出登录">⏻</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">消息中心</h1>
                <div class="header-actions">
                    <button class="btn btn-outline btn-sm" onclick="markAllRead()">全部标为已读</button>
                </div>
            </header>

            <div class="content-body">
                <!-- 消息统计 -->
                <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
                    <div class="stat-card">
                        <div class="stat-icon orange">🔔</div>
                        <div class="stat-info">
                            <h4 id="statUnread">0</h4>
                            <p>未读消息</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue">📨</div>
                        <div class="stat-info">
                            <h4 id="statTotal">0</h4>
                            <p>全部消息</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">⚠</div>
                        <div class="stat-info">
                            <h4 id="statWarning">0</h4>
                            <p>警告消息</p>
                        </div>
                    </div>
                </div>

                <!-- 消息列表 -->
                <div class="card">
                    <div class="card-header">
                        <h3>🔔 消息列表</h3>
                        <div class="form-inline">
                            <select id="filterType" class="form-control" style="width:120px;" onchange="loadMessages()">
                                <option value="">全部类型</option>
                                <option value="notice">通知</option>
                                <option value="warning">警告</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body" id="messageList">
                        <div class="text-center text-muted">加载中...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 消息详情弹窗 -->
    <div class="modal-overlay" id="msgDetailModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="msgDetailTitle">消息详情</h3>
                <button class="modal-close" onclick="closeModal('msgDetailModal')">✕</button>
            </div>
            <div class="modal-body" id="msgDetailBody"></div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('msgDetailModal')">关闭</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!pageInit()) throw new Error('Not logged in');
        setActiveNav('/student/messages');

        let allMessages = [];

        async function loadMessages() {
            try {
                const messages = await api.get(`/api/messages?studentNo=${auth.getStudentNo()}`);
                allMessages = messages;

                const unreadCount = messages.filter(m => m.isRead === 0).length;
                const warningCount = messages.filter(m => m.msgType === 'warning').length;
                document.getElementById('statUnread').textContent = unreadCount;
                document.getElementById('statTotal').textContent = messages.length;
                document.getElementById('statWarning').textContent = warningCount;

                const filterType = document.getElementById('filterType').value;
                const filtered = filterType
                    ? messages.filter(m => m.msgType === filterType)
                    : messages;

                if (filtered.length === 0) {
                    document.getElementById('messageList').innerHTML =
                        '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无消息</p></div>';
                    return;
                }

                document.getElementById('messageList').innerHTML = filtered.map(m => `
                    <div class="msg-item ${m.isRead === 0 ? 'unread' : ''}" onclick="viewMessage(${m.msgId})">
                        <div class="msg-dot ${m.isRead === 1 ? 'read' : ''}"></div>
                        <div class="msg-content">
                            <div class="msg-title">${m.title}</div>
                            <div class="msg-text">${m.content}</div>
                            <div class="msg-meta">
                                <span>${msgTypeTag(m.msgType)}</span>
                                <span>发送人：${m.sender === 'system' ? '系统' : m.sender}</span>
                                <span>${formatDateTime(m.createTime)}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                // 更新侧边栏徽章
                loadUnreadCount();
            } catch (e) {
                toast.error(e.message);
            }
        }

        async function viewMessage(msgId) {
            const msg = allMessages.find(m => m.msgId === msgId);
            if (!msg) return;

            document.getElementById('msgDetailTitle').textContent = msg.title;
            document.getElementById('msgDetailBody').innerHTML = `
                <div style="display:grid; gap:12px;">
                    <div class="d-flex justify-between">
                        <span class="text-muted">类型</span>
                        ${msgTypeTag(msg.msgType)}
                    </div>
                    <div class="d-flex justify-between">
                        <span class="text-muted">发送人</span>
                        <span>${msg.sender === 'system' ? '系统自动发送' : msg.sender}</span>
                    </div>
                    <div class="d-flex justify-between">
                        <span class="text-muted">时间</span>
                        <span>${formatDateTime(msg.createTime)}</span>
                    </div>
                    <div style="border-top:1px solid var(--gray-200); padding-top:12px;">
                        <p style="line-height:1.8;">${msg.content}</p>
                    </div>
                </div>
            `;
            openModal('msgDetailModal');

            // 标记已读
            if (msg.isRead === 0) {
                try {
                    await api.put(`/api/messages/${msgId}/read`);
                    msg.isRead = 1;
                    loadMessages();
                } catch (e) {
                    // 静默
                }
            }
        }

        async function markAllRead() {
            const unread = allMessages.filter(m => m.isRead === 0);
            if (unread.length === 0) {
                toast.warning('没有未读消息');
                return;
            }
            try {
                for (const m of unread) {
                    await api.put(`/api/messages/${m.msgId}/read`);
                }
                toast.success('已全部标为已读');
                loadMessages();
            } catch (e) {
                toast.error(e.message);
            }
        }

        loadMessages();

        function doLogout() {
            auth.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
